---
- name: Require a supported 64-bit Debian-family system
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
      - ansible_facts['architecture'] == 'aarch64'
      - ansible_facts['distribution_release'] in ['bookworm', 'trixie', 'jammy', 'noble']
    fail_msg: Use 64-bit Raspberry Pi OS/Debian 12 or 13, or Ubuntu 22.04/24.04. ARMv7 is not supported.
- name: Install repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, python3, python3-apt, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Remove conflicting packages
  ansible.builtin.apt:
    name: [docker.io, docker-compose, docker-doc, docker-buildx, podman-docker, containerd, runc]
    state: absent
- name: Create apt key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Fetch Docker signing key over verified HTTPS
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
- name: Configure official ARM64 Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: [arm64]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: docker_repository
- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if docker_repository.changed else 3600 }}"
- name: Enable Docker after reboot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
