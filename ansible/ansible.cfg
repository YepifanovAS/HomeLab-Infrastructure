[defaults]
# Шлях до файлу або каталогу інвенторі за замовчуванням
inventory = ./inventory/inventory.ini

# Каталоги, де Ansible шукає власні локальні ролі (через двійку / крапку з комою)
roles_path = ./roles:./roles_galaxy

# Каталог для завантажених ролей з Ansible Galaxy (колекцій/ролей)
# Часто використовується для того, щоб не змішувати кастомні ролі зgalaxy-ролями
collections_path = ./collections
# Примітка: для старих версій Galaxy або спеціального розмежування можна
# використовувати окремий шлях, проте зазвичай Galaxy-ролі встановлюються туди ж,
# куди й локальні, або через колекції.
# Якщо вам потрібно чітко рознести кастомні та galaxy-ролі в різні папки,
# краще задати roles_path як список каталогів (див. пояснення нижче).

# Паралельність виконання (кількість одночасних потоків)
forks = 3

# Збільшення таймауту підключення
timeout = 30

# Використовувати файл паролів для Ansible Vault
vault_password_file = ~/.ansible/vault-password


[privilege_escalation]
# Автоматичне підвищення привілеїв (sudo) за замовчуванням
become = True
become_method = sudo
become_user = root
become_ask_pass = False
