- name: Виконати розгортання екземпляру OpenBao Transit
  hosts: kms
  tasks:
    - name: Виконати розгортання екземпляру OpenBao
      ansible.builtin.include_role:
        name: openbao/deploy
      vars:
        openbao_service_name: "openbao-transit"
        openbao_listen_address: "{{openbao_kms_listen}}"
        openbao_service_fqdn_name: "{{openbao_kms_fqdn_name}}"
        openbao_tls_enabled: true
        openbao_seal_type: "static"
        openbao_seal_static_unseal_key: "{{vault_openbao_kms_unseal_key}}"
    - name: Провести ініціалізацю сховища OpenBao Transit
      ansible.builtin.include_role:
        name: openbao/initialize
      vars:
        openbao_service_name: "openbao-transit"
